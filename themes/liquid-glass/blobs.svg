<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!--
    Liquid Glass wallpaper: big blurred blobs of colour on a dark base.
    Glass looks best over something colourful to bend and blur.
  -->
  <defs>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1033"/>
      <stop offset="1" stop-color="#0b1a2e"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#base)"/>
  <g filter="url(#blur)">
    <ellipse cx="300" cy="250" rx="380" ry="300" fill="#ff4f93"/>
    <ellipse cx="1250" cy="200" rx="420" ry="280" fill="#6a4dff"/>
    <ellipse cx="900" cy="700" rx="460" ry="300" fill="#14c4c0"/>
    <ellipse cx="250" cy="850" rx="320" ry="220" fill="#ff9f43"/>
    <ellipse cx="1450" cy="850" rx="300" ry="240" fill="#3b82f6"/>
  </g>
</svg>
